<!DOCTYPE html>
<html>
<head>
    <title>Multi-entity debugger</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.9.1/underscore-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.4.0/backbone-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.marionette/4.1.2/backbone.marionette.min.js"></script>
</head>
<body>
    <div id="entities-region"></div>
    <div id="messages-region"></div>

    <!-- Templates -->
    <script type="text/template" id="entities-template">
        <h1 id="entities-header">Entities</h1>
        <div id="entities"></div>
    </script>
    <script type="text/template" id="messages-template">
        <div class="messages-header-row">
            <h1 id="messages-header"></h1>
            <div class="header-controls">
                <button id="theme-toggle" class="theme-toggle-button">
                    <span class="theme-icon">🌙</span>
                </button>
                <button id="auto-scroll-toggle" class="auto-scroll-button auto-scroll-on">
                    <span class="auto-scroll-icon">↓</span>
                    <span class="auto-scroll-text">Auto-scroll: ON</span>
                </button>
            </div>
        </div>
        <div class="message-filters">
            <input type="text" id="search-input" placeholder="Search messages..." />
            <div class="log-level-filter-container">
                <div class="log-level-tags" id="log-level-tags"></div>
                <div class="log-level-dropdown">
                    <button type="button" class="log-level-dropdown-btn" id="log-level-dropdown-btn">
                        <span>Filter by level</span>
                        <span class="dropdown-arrow">▾</span>
                    </button>
                    <div class="log-level-dropdown-menu" id="log-level-dropdown-menu">
                        <label class="log-level-option">
                            <input type="checkbox" value="DEBUG"> DEBUG
                        </label>
                        <label class="log-level-option">
                            <input type="checkbox" value="INFO"> INFO
                        </label>
                        <label class="log-level-option">
                            <input type="checkbox" value="WARNING"> WARNING
                        </label>
                        <label class="log-level-option">
                            <input type="checkbox" value="ERROR"> ERROR
                        </label>
                        <label class="log-level-option">
                            <input type="checkbox" value="CRITICAL"> CRITICAL
                        </label>
                    </div>
                </div>
            </div>
            <button id="clear-filters">Clear Filters</button>
            <div class="filter-status" id="filter-status"></div>
        </div>
        <div id="messages"></div>
    </script>
    <script type="text/template" id="help-modal-template">
        <div class="help-modal-overlay" id="help-modal-overlay">
            <div class="help-modal">
                <div class="help-modal-header">
                    <h2>Keyboard Shortcuts</h2>
                    <button class="help-close" id="help-close">&times;</button>
                </div>
                <div class="help-modal-content">
                    <div class="help-section">
                        <h3>Navigation</h3>
                        <div class="help-shortcut">
                            <span class="help-keys">←→ / Tab / Shift+Tab</span>
                            <span class="help-description">Switch between entities</span>
                        </div>
                        <div class="help-shortcut">
                            <span class="help-keys">1-9</span>
                            <span class="help-description">Jump to entity by position</span>
                        </div>
                    </div>
                    <div class="help-section">
                        <h3>Search & Filters</h3>
                        <div class="help-shortcut">
                            <span class="help-keys">Ctrl/Cmd + F</span>
                            <span class="help-description">Focus search input</span>
                        </div>
                        <div class="help-shortcut">
                            <span class="help-keys">Escape</span>
                            <span class="help-description">Clear search and filters</span>
                        </div>
                    </div>
                    <div class="help-section">
                        <h3>Actions</h3>
                        <div class="help-shortcut">
                            <span class="help-keys">S</span>
                            <span class="help-description">Toggle auto-scroll</span>
                        </div>
                        <div class="help-shortcut">
                            <span class="help-keys">Ctrl/Cmd + K</span>
                            <span class="help-description">Clear messages for current entity</span>
                        </div>
                        <div class="help-shortcut">
                            <span class="help-keys">Ctrl/Cmd + Shift + K</span>
                            <span class="help-description">Clear all messages</span>
                        </div>
                        <div class="help-shortcut">
                            <span class="help-keys">D</span>
                            <span class="help-description">Toggle dark mode</span>
                        </div>
                    </div>
                    <div class="help-section">
                        <h3>Help</h3>
                        <div class="help-shortcut">
                            <span class="help-keys">?</span>
                            <span class="help-description">Show/hide this help</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>
    <script type="text/template" id="entity-template">
        <div class="entity-link" id="link-<%- name %>"
             title="Total: <%- messageCount || 0 %> messages&#10;Rate: <%- messageRate || '0.0' %> msgs/min&#10;Last: <%- lastMessage || 'never' %>">
            <a href="#" data-id="<%- name %>">
                <%- label %>
                <span class="entity-badge"><%- messageCount || 0 %></span>
            </a>
        </div>
    </script>
    <script type="text/template" id="message-template">
        <div class="message-container">
            <dl <% if (message.log_level) { %> class="<%- message.log_level.toLowerCase() %>" <% } %>>
                <% _.each(message, function(value, key) {
                    if (!['id', 'name', 'label'].includes(key)) { %>
                        <dt><% if (key === 'timestamp') { %>Time<% } else { %><%- key %><% } %></dt>
                        <dd>
                            <% if (key === 'timestamp') { %>
                                <span class="relative-time" data-timestamp="<%- value %>" title="<%- value %>"><%- value %></span>
                            <% } else if (typeof value === 'object') { %>
                                <pre><%- JSON.stringify(value, null, 2) %></pre>
                            <% } else { %>
                                <%- value %>
                            <% } %>
                        </dd>
                    <% }
                }); %>
            </dl>
        </div>
    </script>

    <script src="/static/websocket.js"></script>
</body>
</html>
